parameters:
  - name: deploymentType
    type: string
  - name: environmentName
    type: string
  - name: stage
    type: string  
  - name: subscriptionName
    type: string
  - name: subscriptionType
    type: string
  - name: regions
    type: object
  - name: dockerImageRepository
    type: string
  - name: dockerImageTag
    type: string
  - name: staticWebAppName
    type: string
  - name: staticWebAppSku
    type: string
  - name: staticWebAppTier
    type: string
  - name: sqlConnectionType
    type: string

stages:
    - ${{ each region in parameters.regions }}:      
      - template: provision-region.yml
        parameters:
          deploymentType: ${{ parameters.deploymentType }}
          environmentName: ${{ parameters.environmentName }}
          stage: ${{ parameters.stage }}
          subscriptionName: ${{ parameters.subscriptionName }}
          subscriptionType: ${{ parameters.subscriptionType }}
          region: ${{ region }}
          dockerImageRepository: ${{ parameters.dockerImageRepository }}
          dockerImageTag: ${{ parameters.dockerImageTag }}
          staticWebAppName: ${{ parameters.staticWebAppName }}
          staticWebAppSku: ${{ parameters.staticWebAppSku }}
          staticWebAppTier: ${{ parameters.staticWebAppTier }}
          sqlConnectionType: ${{ parameters.sqlConnectionType }}